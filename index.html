<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUNE&PLAY-ID - TUIDE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{
 min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;
 background-image: url('tuide.jpg');
 background-size: cover; background-position: center top; background-attachment: fixed;
}
body::before{content:'';position:fixed;inset:0;background: rgba(232,214,242,0.60);z-index:-1;}
.container{background: rgba(255,255,255,0.95); padding:24px; border-radius:20px; max-width:430px; width:100%; margin-bottom:26px; border:3.5px solid #3E2723; z-index:2;}
label{font-size:14px;font-weight:900;color:#3E2723;margin-bottom:7px;display:block}
input,select{width:100%;padding:12px;border:3px solid #C9A86A;border-radius:11px;background:#FFF8EF;font-weight:700;color:#3E2723;outline:none}
.member-selector{display:flex;gap:6px;flex-wrap:wrap}
.member-btn{flex:1;min-width:72px;border:3px solid #C9A86A;background:#FFF8EF;border-radius:11px;padding:9px 4px;font-size:11px;font-weight:900;color:#3E2723;cursor:pointer;text-align:center}
.member-btn.active{background:#3E2723;color:#fff}
button.download-btn{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,#D9B779,#5C3A1A);border:none;border-radius:12px;font-weight:900;color:#fff;font-size:16px;cursor:pointer}
.card{
 width:390px; height:245px;
 background: linear-gradient(135deg, rgba(253,243,214,0.90) 0%, rgba(217,183,121,0.90) 100%);
 border:4px solid #2D1B12; border-radius:20px; padding:0; display:flex; position:relative; overflow:hidden; z-index:2;
}
.card-bg{
 position:absolute; inset:0;
 background-image: url('tuide.jpg');
 background-size: 105%; background-position: 50% 18%; background-repeat:no-repeat; opacity:0.42; z-index:1;
}
.card-content{position:relative; z-index:3; display:flex; gap:16px; padding:18px; width:100%; height:100%}
.photo-area{
 width:108px; height:145px; background:#FFF8EF; border-radius:12px; border:3.5px solid #2D1B12;
 display:flex; align-items:center; justify-content:center; color:#3E2723; font-weight:900; overflow:hidden; flex-shrink:0;
 font-size:12px; text-align:center;
}
.photo-area img{width:100%;height:100%;object-fit:cover; display:block}
.info-area{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.info-title{font-size:10px;font-weight:900;letter-spacing:1.3px;color:#5C3A1A; text-transform:uppercase;}
.info-value{font-size:16px;font-weight:900;color:#2D1B12; text-shadow:0 1px 0 rgba(255,255,255,0.8);}
.card-header{position:absolute;top:10px;right:12px;z-index:4;background:#2D1B12;color:#fff;font-size:11px;font-weight:900;padding:5px 11px;border-radius:20px;}
</style>
</head>
<body>
<div class="container">
 <h3 style="text-align:center;font-size:20px;font-weight:900;color:#2D1B12;margin-bottom:16px;">TUNE&PLAY-ID</h3>
 <label>1. Choose Your Utt</label>
 <div class="member-selector" style="margin-bottom:16px">
  <div class="member-btn" onclick="selectMember('sohee')" id="btn-sohee">SEOHEE</div>
  <div class="member-btn" onclick="selectMember('soyeon')" id="btn-soyeon">SEOYEON</div>
  <div class="member-btn" onclick="selectMember('elena')" id="btn-elena">ELENA</div>
  <div class="member-btn" onclick="selectMember('jia')" id="btn-jia">JIA</div>
  <div class="member-btn" onclick="selectMember('misaki')" id="btn-misaki">MISAKI</div>
  <div class="member-btn" onclick="selectMember('seah')" id="btn-seah">SEAH</div>
  <div class="member-btn" onclick="selectMember('hani')" id="btn-hani">YI HANI</div>
 </div>
 <label>Your Name:</label>
 <input id="inputName" placeholder="your name or nick" oninput="updateCard()" style="margin-bottom:14px">
 <label>Fav Song</label>
 <select id="inputSong" onchange="updateCard()"><option value="GRLS">GRLS</option><option value="SUN KISS">SUN KISS</option><option value="FLIP-FLOP GIRLS">FLIP-FLOP GIRLS</option><option value="ECHO">ECHO</option><option value="ABD">ABD</option></select>
 <button class="download-btn" onclick="downloadCard()">SAVE 💾</button>
 <div id="resultImageContainer" style="display:none;margin-top:20px;text-align:center"><p style="background:#fff;border:3px solid #2D1B12;padding:10px;border-radius:10px;font-weight:900;margin-bottom:10px">👇 Segure para salvar!</p><img id="resultImage" style="width:100%;border-radius:18px;border:4px solid #2D1B12"></div>
</div>
<div class="card" id="coerCard">
 <div class="card-bg"></div>
 <div class="card-header">TUNE&PLAY</div>
 <div class="card-content">
  <div class="photo-area" id="cardPhotoArea"><span style="opacity:0.5">FOTO</span></div>
  <div class="info-area">
   <div><div class="info-title">Fan Name</div><div class="info-value" id="cardName">Your Name</div></div>
   <div><div class="info-title">My Utt</div><div class="info-value" id="cardUtt">select</div></div>
   <div><div class="info-title">Fav Song</div><div class="info-value" id="cardSong">GRLS</div></div>
  </div>
 </div>
</div>
<script>
let selectedUtt="";
// AGORA TENTA .jpg, .jpeg, .JPG - SE NAO ACHAR MOSTRA NOME BONITINHO
function selectMember(name){
 selectedUtt=name.toUpperCase();
 document.querySelectorAll('.member-btn').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+name).classList.add('active');
 const area=document.getElementById('cardPhotoArea');
 // tenta carregar em .jpg, se falhar tenta .jpeg
 area.innerHTML=`<img src="${name}.jpg" alt="${name}" onerror="this.onerror=null; this.src='${name}.jpeg'; this.onerror=function(){this.outerHTML='<div style=\\'background:#FFF8EF;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#3E2723\\'>${name.toUpperCase()}</div>'}">`;
 updateCard();
}
function updateCard(){
 document.getElementById('cardName').innerText=document.getElementById('inputName').value||'Your Name';
 document.getElementById('cardUtt').innerText=selectedUtt||'select';
 document.getElementById('cardSong').innerText=document.getElementById('inputSong').value;
}
function downloadCard(){
 html2canvas(document.getElementById('coerCard'),{scale:3,useCORS:true,backgroundColor:null}).then(canvas=>{
  const data=canvas.toDataURL('image/png');
  document.getElementById('resultImage').src=data;
  document.getElementById('resultImageContainer').style.display='block';
  document.getElementById('resultImageContainer').scrollIntoView({behavior:'smooth'});
  const a=document.createElement('a');a.download='tuide-id.png';a.href=data;a.click();
 });
}
</script>
</body>
</html>
